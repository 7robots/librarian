[project]
name = "librarian"
version = "0.1.0"
description = "Terminal Notes & Tasks - a TUI for browsing a folder of markdown notes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jefferson Burson" }]
dependencies = [
    "textual>=8.2.8",
    "watchdog>=4.0.0",
    "markdown>=3.5.0",
]

# Optional: with remtui installed, the Reminders tool opens as a panel inside
# Librarian instead of suspending and handing over the terminal.
[project.optional-dependencies]
# The marker keeps librarian installable on 3.10/3.11, where remtui (3.12+)
# cannot be resolved; the panel simply is not available there.
reminders = ["remtui @ git+https://github.com/7robots/remtui.git ; python_version >= '3.12'"]

[project.scripts]
librarian = "librarian.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# remtui is referenced by git URL, which hatchling treats as a direct
# reference and rejects unless allowed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/librarian"]

[project.urls]
Homepage = "https://github.com/7robots/librarian"
Repository = "https://github.com/7robots/librarian"
