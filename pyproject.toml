[project]
name = "librarian"
version = "0.1.0"
description = "Terminal Notes & Tasks - a TUI for browsing a folder of markdown notes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jefferson Burson" }]
dependencies = [
    "textual>=8.2.8",
    "watchdog>=4.0.0",
    "markdown>=3.5.0",
]

[project.scripts]
librarian = "librarian.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/librarian"]

[project.urls]
Homepage = "https://github.com/7robots/librarian"
Repository = "https://github.com/7robots/librarian"
